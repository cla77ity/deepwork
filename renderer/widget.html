<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'; script-src 'unsafe-inline'">
  <style>
    @font-face { font-family: "Inter"; font-weight: 100 900; src: url(fonts/inter-cyrillic-wght-normal.woff2) format("woff2-variations"); unicode-range: U+0400-045F, U+0490-0491, U+2116; }
    @font-face { font-family: "Inter"; font-weight: 100 900; src: url(fonts/inter-latin-wght-normal.woff2) format("woff2-variations"); unicode-range: U+0000-00FF, U+2000-206F; }
    html, body { margin: 0; background: transparent; overflow: hidden; font: 13px/1.3 "Inter", "Segoe UI", sans-serif; color: #f2f3f5; -webkit-font-smoothing: antialiased; user-select: none; }
    /* the whole card drags the window; the buttons opt out */
    .w { position: absolute; inset: 5px; border-radius: 18px; background: rgba(10, 10, 12, .9); border: 1px solid rgba(255, 255, 255, .1);
      box-shadow: inset 0 1px 0 rgba(255, 255, 255, .05); display: flex; align-items: center; gap: 13px; padding: 0 12px 0 13px; -webkit-app-region: drag;
      animation: in .4s cubic-bezier(.2, .8, .2, 1); transition: border-color .2s; }
    .w:hover { border-color: rgba(255, 255, 255, .18); }
    .ring { width: 46px; height: 46px; flex: none; position: relative; }
    .ring svg { width: 100%; height: 100%; transform: rotate(-90deg); }
    .prog { stroke: #e8ecff; transition: stroke-dashoffset .95s linear; filter: drop-shadow(0 0 4px rgba(180, 195, 255, .5)); }
    .brk .prog { stroke: #8d9099; filter: none; }
    .body { flex: 1; min-width: 0; }
    .time { font: 300 26px/1 "Inter", sans-serif; letter-spacing: -.03em; font-variant-numeric: tabular-nums; }
    .sub { color: #8d9099; font-size: 11.5px; margin-top: 4px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .ph { color: #e8ecff; text-transform: uppercase; letter-spacing: .14em; font-size: 10px; font-weight: 600; }
    .brk .ph { color: #8d9099; }
    .btns { display: flex; flex-direction: column; gap: 4px; -webkit-app-region: no-drag; opacity: 0; transition: opacity .2s; }
    .w:hover .btns { opacity: 1; }
    button { width: 22px; height: 22px; border: 0; border-radius: 7px; background: rgba(255, 255, 255, .06); color: #8d9099; display: grid; place-items: center; cursor: pointer; padding: 0; transition: background .15s, color .15s; }
    button:hover { background: rgba(255, 255, 255, .12); color: #fff; }
    button svg { width: 11px; height: 11px; stroke: currentColor; stroke-width: 2; fill: none; }
    @keyframes in { from { opacity: 0; transform: translateY(-6px); } }
  </style>
</head>
<body>
  <div class="w" id="w">
    <div class="ring"><svg viewBox="0 0 46 46"><circle cx="23" cy="23" r="19" fill="none" stroke="rgba(255,255,255,.08)" stroke-width="4"/><circle class="prog" id="arc" cx="23" cy="23" r="19" fill="none" stroke-width="4" stroke-linecap="round" stroke-dasharray="119.4" stroke-dashoffset="0"/></svg></div>
    <div class="body"><div class="ph" id="ph"></div><div class="time" id="time">—</div><div class="sub" id="sub"></div></div>
    <div class="btns">
      <button id="open" title="Открыть Deepwork"><svg viewBox="0 0 12 12"><path d="M4 2h6v6M10 2L3 9"/></svg></button>
      <button id="hide" title="Скрыть виджет (вернуть — в настройках)"><svg viewBox="0 0 12 12"><path d="M3 3l6 6M9 3L3 9"/></svg></button>
    </div>
  </div>
  <script>
    const $ = id => document.getElementById(id);
    const C = 119.4;
    const PH = { focus: 'Фокус', short: 'Перерыв', long: 'Длинный перерыв' };
    let s = null;
    const clock = ms => { const t = Math.max(0, Math.round(ms / 1000)), h = Math.floor(t / 3600), m = Math.floor(t % 3600 / 60), x = t % 60; return (h ? h + ':' + String(m).padStart(2, '0') : m) + ':' + String(x).padStart(2, '0'); };
    function tick() {
      const w = $('w');
      if (!s) { w.classList.remove('brk'); $('ph').textContent = 'Deepwork'; $('time').textContent = 'Не в фокусе'; $('time').style.fontSize = '17px'; $('sub').textContent = 'Нажми ↗, чтобы начать'; $('arc').style.strokeDashoffset = C; return; }
      $('time').style.fontSize = '';
      w.classList.toggle('brk', s.phase !== 'focus');
      const now = s.pausedAt || Date.now();
      $('ph').textContent = (PH[s.phase] || '') + (s.status === 'paused' ? ' · пауза' : '');
      if (s.phaseEnd) {
        const left = s.phaseEnd - now, total = s.phaseEnd - s.phaseStart;
        $('time').textContent = clock(left);
        $('arc').style.strokeDashoffset = String(C * (1 - Math.max(0, left) / total));
      } else {
        $('time').textContent = clock(now - s.phaseStart);
        $('arc').style.strokeDashoffset = String(C * (1 - ((now - s.phaseStart) % 3600000) / 3600000));
      }
      $('sub').textContent = s.goal || (s.mode === 'pomodoro' ? `раунд ${s.round} из ${s.rounds}` : '');
    }
    window.dw.on('session', p => { s = p.session; tick(); });
    window.dw.call('init').then(st => { s = st.session; tick(); });
    $('open').onclick = () => window.dw.call('win:show');
    $('hide').onclick = () => window.dw.call('widget:hide');
    setInterval(tick, 1000);
  </script>
</body>
</html>
