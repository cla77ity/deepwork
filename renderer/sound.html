<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'unsafe-inline'">
</head>
<body>
  <script>
    // Ambient sounds generated with Web Audio — no audio files. Every kind is a graph that
    // ends in `master`; switching kinds cross-fades.
    let ctx = null, master = null, current = null;

    function noiseBuffer(kind, seconds = 4) {
      const len = ctx.sampleRate * seconds, buf = ctx.createBuffer(2, len, ctx.sampleRate);
      for (let ch = 0; ch < 2; ch++) {
        const d = buf.getChannelData(ch);
        let b0 = 0, b1 = 0, b2 = 0, b3 = 0, b4 = 0, b5 = 0, b6 = 0, last = 0;
        for (let i = 0; i < len; i++) {
          const w = Math.random() * 2 - 1;
          if (kind === 'white') d[i] = w * 0.5;
          else if (kind === 'pink') { // Paul Kellet's filter
            b0 = 0.99886 * b0 + w * 0.0555179; b1 = 0.99332 * b1 + w * 0.0750759; b2 = 0.969 * b2 + w * 0.153852;
            b3 = 0.8665 * b3 + w * 0.3104856; b4 = 0.55 * b4 + w * 0.5329522; b5 = -0.7616 * b5 - w * 0.016898;
            d[i] = (b0 + b1 + b2 + b3 + b4 + b5 + b6 + w * 0.5362) * 0.11; b6 = w * 0.115926;
          } else { last = (last + 0.02 * w) / 1.02; d[i] = last * 3.5; } // brown
        }
      }
      return buf;
    }

    function loop(buf) { const s = ctx.createBufferSource(); s.buffer = buf; s.loop = true; s.start(); return s; }

    function build(kind) {
      const out = ctx.createGain();
      const nodes = [];
      if (kind === 'white' || kind === 'pink' || kind === 'brown') {
        const s = loop(noiseBuffer(kind)); s.connect(out); nodes.push(s);
      } else if (kind === 'rain') {
        // steady hiss + random droplets
        const s = loop(noiseBuffer('pink'));
        const hp = ctx.createBiquadFilter(); hp.type = 'highpass'; hp.frequency.value = 600;
        const lp = ctx.createBiquadFilter(); lp.type = 'lowpass'; lp.frequency.value = 7000;
        s.connect(hp).connect(lp).connect(out); nodes.push(s);
        const dropBuf = noiseBuffer('white', 0.05);
        const drop = () => {
          if (!current || current.kind !== 'rain') return;
          const d = ctx.createBufferSource(); d.buffer = dropBuf;
          const g = ctx.createGain(); g.gain.value = 0.05 + Math.random() * 0.12;
          const bp = ctx.createBiquadFilter(); bp.type = 'bandpass'; bp.frequency.value = 1500 + Math.random() * 4000;
          d.connect(bp).connect(g).connect(out); d.start();
          setTimeout(drop, 15 + Math.random() * 90);
        };
        setTimeout(drop, 100);
      } else if (kind === 'waves') {
        // brown noise breathing in and out like surf
        const s = loop(noiseBuffer('brown'));
        const lp = ctx.createBiquadFilter(); lp.type = 'lowpass'; lp.frequency.value = 900;
        const g = ctx.createGain(); g.gain.value = 0.55;
        const lfo = ctx.createOscillator(); lfo.frequency.value = 0.09;
        const depth = ctx.createGain(); depth.gain.value = 0.45;
        lfo.connect(depth).connect(g.gain); lfo.start();
        s.connect(lp).connect(g).connect(out); nodes.push(s, lfo);
      } else if (kind === 'binaural') {
        // 200 Hz left, 210 Hz right → 10 Hz alpha beat; needs headphones
        const merger = ctx.createChannelMerger(2);
        [200, 210].forEach((f, ch) => { const o = ctx.createOscillator(); o.frequency.value = f; const g = ctx.createGain(); g.gain.value = 0.25; o.connect(g).connect(merger, 0, ch); o.start(); nodes.push(o); });
        const s = loop(noiseBuffer('brown')); const g = ctx.createGain(); g.gain.value = 0.15; s.connect(g).connect(out); nodes.push(s);
        merger.connect(out);
      }
      out.gain.value = 0;
      out.connect(master);
      return { kind, out, nodes };
    }

    function fadeOut(c) {
      if (!c) return;
      c.out.gain.cancelScheduledValues(ctx.currentTime);
      c.out.gain.setTargetAtTime(0, ctx.currentTime, 0.4);
      setTimeout(() => { c.nodes.forEach(n => { try { n.stop(); } catch { } }); c.out.disconnect(); }, 2500);
    }

    window.dw.on('ambient', ({ kind, volume, playing }) => {
      if (!ctx) { ctx = new AudioContext(); master = ctx.createGain(); master.connect(ctx.destination); }
      master.gain.setTargetAtTime(Math.max(0, Math.min(1, volume == null ? 0.4 : volume)), ctx.currentTime, 0.2);
      if (!playing || kind === 'off') { fadeOut(current); current = null; return; }
      if (current && current.kind === kind) return;
      fadeOut(current);
      current = build(kind);
      current.out.gain.setTargetAtTime(1, ctx.currentTime, 0.6);
    });
  </script>
</body>
</html>
