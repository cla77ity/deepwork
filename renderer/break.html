<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'; script-src 'unsafe-inline'">
  <style>
    @font-face { font-family: "Inter"; font-weight: 100 900; src: url(fonts/inter-cyrillic-wght-normal.woff2) format("woff2-variations"); unicode-range: U+0400-045F, U+0490-0491, U+2116; }
    @font-face { font-family: "Inter"; font-weight: 100 900; src: url(fonts/inter-latin-wght-normal.woff2) format("woff2-variations"); unicode-range: U+0000-00FF, U+2000-206F; }
    html, body { margin: 0; height: 100%; background: #050505; color: #f2f3f5; font: 15px/1.5 "Inter", "Segoe UI", sans-serif; -webkit-font-smoothing: antialiased; overflow: hidden; user-select: none; }
    body { display: grid; place-items: center; }
    body::before { content: ""; position: fixed; inset: 10% 20%; background: radial-gradient(closest-side, rgba(180, 195, 255, .06), transparent); }
    .b { position: relative; text-align: center; animation: in .8s cubic-bezier(.2, .8, .2, 1); }
    .ph { font-size: 12px; letter-spacing: .24em; text-transform: uppercase; color: #8d9099; font-weight: 600; }
    .time { font: 200 120px/1 "Inter", sans-serif; letter-spacing: -.04em; font-variant-numeric: tabular-nums; margin: 14px 0 30px; }
    /* breathing guide: 4 s in, 4 s out */
    .breath { width: 140px; height: 140px; margin: 0 auto 26px; border-radius: 50%; border: 1.5px solid rgba(232, 236, 255, .5);
      box-shadow: 0 0 40px rgba(180, 195, 255, .15), inset 0 0 30px rgba(180, 195, 255, .08); animation: breathe 8s ease-in-out infinite; display: grid; place-items: center; color: #8d9099; font-size: 13px; }
    .tip { font: 500 22px "Inter", sans-serif; letter-spacing: -.01em; min-height: 34px; transition: opacity .6s; }
    .sub { color: #55585f; margin-top: 8px; }
    .acts { margin-top: 40px; display: flex; gap: 10px; justify-content: center; }
    button { font: inherit; border: 1px solid rgba(255, 255, 255, .12); background: #111113; color: #8d9099; padding: 10px 18px; border-radius: 12px; cursor: pointer; transition: border-color .16s, color .16s; }
    button:hover:not(:disabled) { border-color: rgba(255, 255, 255, .25); color: #f2f3f5; }
    button:disabled { opacity: .35; cursor: default; }
    @keyframes breathe { 0%, 100% { transform: scale(.78); } 50% { transform: scale(1.08); border-color: rgba(232, 236, 255, .85); } }
    @keyframes in { from { opacity: 0; transform: scale(.97); } }
  </style>
</head>
<body>
  <div class="b">
    <div class="ph" id="ph">Перерыв</div>
    <div class="time" id="time">5:00</div>
    <div class="breath" id="br">вдох</div>
    <div class="tip" id="tip"></div>
    <div class="sub" id="sub"></div>
    <div class="acts">
      <button id="close">Закрыть экран</button>
      <button id="skip">Пропустить перерыв</button>
    </div>
  </div>
  <script>
    const $ = id => document.getElementById(id);
    const TIPS = [
      'Посмотри вдаль 20 секунд — глазам нужен отдых',
      'Встань и потянись',
      'Выпей стакан воды',
      'Пройдись по комнате',
      'Опусти плечи, расслабь челюсть',
      'Подыши: вдох на 4, выдох на 4',
      'Не открывай ленту — дай мозгу пустоту',
    ];
    let s = null, mode = 'soft', opened = Date.now(), tipI = Math.floor(Math.random() * TIPS.length);
    const clock = ms => { const t = Math.max(0, Math.round(ms / 1000)); return Math.floor(t / 60) + ':' + String(t % 60).padStart(2, '0'); };
    function tick() {
      if (!s) return;
      $('time').textContent = clock(s.phaseEnd - Date.now());
      // strict: the screen can be closed only after a minute (an exit for emergencies)
      const wait = mode === 'strict' ? Math.max(0, 60 - Math.floor((Date.now() - opened) / 1000)) : 0;
      $('close').disabled = wait > 0;
      $('close').textContent = wait > 0 ? `Закрыть экран (${wait})` : 'Закрыть экран';
      $('skip').style.display = mode === 'strict' ? 'none' : '';
      const phaseSec = Math.floor((Date.now() - opened) / 1000) % 8;
      $('br').textContent = phaseSec < 4 ? 'вдох' : 'выдох';
    }
    function nextTip() { $('tip').style.opacity = 0; setTimeout(() => { $('tip').textContent = TIPS[tipI++ % TIPS.length]; $('tip').style.opacity = 1; }, 600); }
    window.dw.on('break', p => {
      s = p.session; mode = p.mode;
      $('ph').textContent = s.phase === 'long' ? 'Длинный перерыв' : 'Перерыв';
      $('sub').textContent = s.goal ? 'Потом — ' + s.goal : '';
      tick();
    });
    $('close').onclick = () => window.dw.call('break:close');
    $('skip').onclick = () => window.dw.call('session:skipBreak');
    document.addEventListener('keydown', e => { if (e.key === 'Escape' && mode !== 'strict') window.dw.call('break:close'); });
    nextTip();
    setInterval(tick, 1000);
    setInterval(nextTip, 20000);
  </script>
</body>
</html>
