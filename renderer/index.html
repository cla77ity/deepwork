<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:">
  <title>Deepwork</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="titlebar">
    <div class="brand"><span class="brand-ring"></span>deepwork</div>
    <button id="pill" class="pill hidden"></button>
    <div class="spacer"></div>
    <div class="winbtns">
      <button data-win="min" title="Свернуть"><svg viewBox="0 0 12 12"><path d="M2 6h8"/></svg></button>
      <button data-win="close" title="Скрыть (Deepwork продолжит работать)"><svg viewBox="0 0 12 12"><path d="M3 3l6 6M9 3l-6 6"/></svg></button>
    </div>
  </header>
  <div class="shell">
    <nav class="side" id="nav"></nav>
    <main id="view"></main>
  </div>
  <div id="modal-root"></div>
  <div id="toasts"></div>

  <script src="js/core.js"></script>
  <script src="js/focus.js"></script>
  <script src="js/plan.js"></script>
  <script src="js/blocks.js"></script>
  <script src="js/journal.js"></script>
  <script src="js/stats.js"></script>
  <script src="js/settings.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
