<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <title>Заблокировано — Deepwork</title>
  <style>
    :root { color-scheme: dark; }
    html, body { margin: 0; height: 100%; background: #0a0c11; color: #e9ebf2; font: 15px/1.5 "Segoe UI Variable Text", "Segoe UI", system-ui, sans-serif; }
    body { display: grid; place-items: center; }
    .b { text-align: center; max-width: 520px; padding: 24px; }
    .ring { width: 150px; height: 150px; margin: 0 auto 28px; position: relative; }
    .ring svg { width: 100%; height: 100%; transform: rotate(-90deg); }
    .ring .t { position: absolute; inset: 0; display: grid; place-items: center; font: 200 34px "Segoe UI Variable Display", "Segoe UI", sans-serif; font-variant-numeric: tabular-nums; }
    h1 { font: 600 28px "Segoe UI Variable Display", "Segoe UI", sans-serif; margin: 0 0 8px; letter-spacing: -.2px; }
    .host { color: #6d7cff; }
    p { color: #8b91a3; margin: 0 0 6px; }
    .goal { margin: 18px 0 26px; padding: 12px 16px; border: 1px solid rgba(255, 255, 255, .08); border-radius: 12px; background: #10131a; }
    .goal b { display: block; font-size: 12px; text-transform: uppercase; letter-spacing: .12em; color: #5c6273; margin-bottom: 3px; font-weight: 600; }
    .acts { display: flex; gap: 10px; justify-content: center; flex-wrap: wrap; }
    button { font: inherit; border: 1px solid rgba(255, 255, 255, .12); background: #151922; color: #e9ebf2; padding: 10px 18px; border-radius: 11px; cursor: pointer; }
    button.primary { background: #6d7cff; border-color: transparent; font-weight: 600; }
    button:disabled { opacity: .45; cursor: default; }
    .tip { margin-top: 30px; font-size: 13px; color: #5c6273; }
  </style>
</head>
<body>
  <div class="b">
    <div class="ring">
      <svg viewBox="0 0 150 150"><circle cx="75" cy="75" r="66" fill="none" stroke="rgba(255,255,255,.06)" stroke-width="8"/><circle id="arc" cx="75" cy="75" r="66" fill="none" stroke="#6d7cff" stroke-width="8" stroke-linecap="round" stroke-dasharray="414.7" stroke-dashoffset="0"/></svg>
      <div class="t" id="left"></div>
    </div>
    <h1>Ты в фокусе</h1>
    <p><span class="host" id="host"></span> <span id="why">сейчас заблокирован</span></p>
    <div class="goal" id="goalBox" hidden><b>Цель сессии</b><span id="goal"></span></div>
    <div class="acts">
      <button class="primary" id="back">Вернуться к работе</button>
      <button id="anyway" hidden></button>
    </div>
    <div class="tip" id="tip"></div>
  </div>
  <script src="blocked.js"></script>
</body>
</html>
